{% extends "base.html" %}
{% block content %}
<div class="flex items-center justify-center min-h-[80vh]">
    <div class="card rounded-2xl p-8 w-full max-w-md">
        <div class="text-center mb-6">
            <i class="fas fa-hdd text-accent text-4xl mb-3"></i>
            <h1 class="text-2xl font-bold">Disk Monitor</h1>
            <p class="text-slate-400 text-sm mt-1">Surveillance et nettoyage du disque</p>
        </div>
        <form id="login-form" class="space-y-4">
            <div>
                <label class="block text-sm text-slate-400 mb-1">Email</label>
                <input type="email" id="email" required placeholder="votre@email.com"
                    class="w-full px-3 py-2 rounded-lg input-field">
            </div>
            <div>
                <label class="block text-sm text-slate-400 mb-1">Mot de passe</label>
                <input type="password" id="password" required placeholder="••••••••"
                    class="w-full px-3 py-2 rounded-lg input-field">
            </div>
            <div id="login-error" class="text-red-400 text-sm hidden"></div>
            <button type="submit" class="w-full btn-primary py-2 rounded-lg">
                <i class="fas fa-sign-in-alt mr-2"></i>Se connecter
            </button>
        </form>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    document.getElementById('login-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        const errorEl = document.getElementById('login-error');
        errorEl.classList.add('hidden');

        try {
            const result = await fetch('/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password }),
            });
            const data = await result.json();
            if (!result.ok) {
                errorEl.textContent = data.detail || 'Erreur de connexion';
                errorEl.classList.remove('hidden');
                return;
            }
            localStorage.setItem('token', data.token);
            window.location.href = '/';
        } catch (err) {
            errorEl.textContent = 'Erreur réseau';
            errorEl.classList.remove('hidden');
        }
    });
</script>
{% endblock %}
