{% extends "base.html" %}
{% block content %}
<div class="space-y-6">
    <div>
        <h1 class="text-2xl font-bold flex items-center gap-2">
            <i class="fas fa-broom text-accent"></i> Nettoyage avancé
        </h1>
        <p class="text-slate-400 mt-1">Actions de nettoyage complètes</p>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
        <button onclick="runCleanup('docker_prune')" class="card rounded-xl p-5 text-left hover:border-accent transition-colors group">
            <i class="fas fa-trash-alt text-red-400 text-2xl mb-3 group-hover:scale-110 transition-transform"></i>
            <div class="font-bold text-lg">Docker prune complet</div>
            <div class="text-sm text-slate-400 mt-1">Images, volumes, cache build + conteneurs arrêtés</div>
        </button>
        <button onclick="runCleanup('docker_builder')" class="card rounded-xl p-5 text-left hover:border-accent transition-colors group">
            <i class="fas fa-truck-loading text-blue-400 text-2xl mb-3 group-hover:scale-110 transition-transform"></i>
            <div class="font-bold text-lg">Builder cache</div>
            <div class="text-sm text-slate-400 mt-1">Supprimer tout le cache de construction Docker</div>
        </button>
        <button onclick="runCleanup('docker_images')" class="card rounded-xl p-5 text-left hover:border-accent transition-colors group">
            <i class="fas fa-image text-purple-400 text-2xl mb-3 group-hover:scale-110 transition-transform"></i>
            <div class="font-bold text-lg">Images Docker</div>
            <div class="text-sm text-slate-400 mt-1">Supprimer les images non utilisées</div>
        </button>
        <button onclick="runCleanup('docker_volumes')" class="card rounded-xl p-5 text-left hover:border-accent transition-colors group">
            <i class="fas fa-database text-green-400 text-2xl mb-3 group-hover:scale-110 transition-transform"></i>
            <div class="font-bold text-lg">Volumes Docker</div>
            <div class="text-sm text-slate-400 mt-1">Supprimer les volumes orphelins</div>
        </button>
        <button onclick="runCleanup('logs')" class="card rounded-xl p-5 text-left hover:border-accent transition-colors group">
            <i class="fas fa-scroll text-yellow-400 text-2xl mb-3 group-hover:scale-110 transition-transform"></i>
            <div class="font-bold text-lg">Logs système</div>
            <div class="text-sm text-slate-400 mt-1">Vacuum journalctl à 50MB</div>
        </button>
        <button onclick="runCleanup('tmp')" class="card rounded-xl p-5 text-left hover:border-accent transition-colors group">
            <i class="fas fa-temp text-orange-400 text-2xl mb-3 group-hover:scale-110 transition-transform"></i>
            <div class="font-bold text-lg">Temporaires</div>
            <div class="text-sm text-slate-400 mt-1">Vider /tmp et /var/tmp</div>
        </button>
        <button onclick="runCleanup('pnpm')" class="card rounded-xl p-5 text-left hover:border-accent transition-colors group">
            <i class="fab fa-node text-green-500 text-2xl mb-3 group-hover:scale-110 transition-transform"></i>
            <div class="font-bold text-lg">Cache pnpm</div>
            <div class="text-sm text-slate-400 mt-1">Supprimer le store pnpm (~700MB)</div>
        </button>
        <button onclick="runCleanup('npm')" class="card rounded-xl p-5 text-left hover:border-accent transition-colors group">
            <i class="fab fa-npm text-red-500 text-2xl mb-3 group-hover:scale-110 transition-transform"></i>
            <div class="font-bold text-lg">Cache npm</div>
            <div class="text-sm text-slate-400 mt-1">Purger le cache npm</div>
        </button>
    </div>

    <div class="card rounded-xl p-6">
        <h2 class="font-bold text-lg mb-4"><i class="fas fa-history text-slate-400 mr-2"></i>Historique</h2>
        <div class="overflow-x-auto">
            <table class="w-full text-sm">
                <thead>
                    <tr class="text-slate-400 text-left border-b border-slate-700">
                        <th class="pb-2">Date</th>
                        <th class="pb-2">Action</th>
                        <th class="pb-2">Espace libéré</th>
                        <th class="pb-2">Statut</th>
                        <th class="pb-2">Détails</th>
                    </tr>
                </thead>
                <tbody id="history-table"></tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    async function runCleanup(action) {
        if (!confirm('Confirmer cette action de nettoyage ?')) return;
        const btn = event.target.closest('button');
        const orig = btn.innerHTML;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Exécution...';
        btn.disabled = true;
        try {
            const result = await apiFetch('/disks/cleanup/execute', {
                method: 'POST',
                body: JSON.stringify({ action }),
            });
            if (result.ok) {
                alert('Nettoyage terminé !');
                await loadHistory();
            } else {
                alert('Erreur: ' + (result.detail || 'Erreur inconnue'));
            }
        } catch (e) {
            alert('Erreur: ' + e.message);
        } finally {
            btn.innerHTML = orig;
            btn.disabled = false;
        }
    }

    async function loadHistory() {
        const history = await apiFetch('/disks/history?limit=30');
        const tbody = document.getElementById('history-table');
        if (!history.length) {
            tbody.innerHTML = '<tr><td colspan="5" class="py-4 text-center text-slate-500">Aucun historique</td></tr>';
            return;
        }
        tbody.innerHTML = history.map(h => `
            <tr class="border-b border-slate-800 hover:bg-slate-800/50">
                <td class="py-2 text-slate-400">${formatDate(h.created_at)}</td>
                <td class="py-2 font-mono text-xs">${h.action}</td>
                <td class="py-2 font-mono">${h.space_freed_bytes ? formatBytes(h.space_freed_bytes) : '-'}</td>
                <td class="py-2"><span class="px-2 py-0.5 rounded-full text-xs ${h.status === 'ok' ? 'bg-green-500/20 text-green-400' : 'bg-red-500/20 text-red-400'}">${h.status}</span></td>
                <td class="py-2 text-slate-400 text-xs">${h.details || ''}</td>
            </tr>
        `).join('');
    }

    (async () => {
        if (await checkAuth()) await loadHistory();
    })();
</script>
{% endblock %}
